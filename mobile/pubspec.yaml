name: testo
description: AI-powered document-to-exam system
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.0

  # HTTP & Networking
  dio: ^5.4.3

  # Dependency Injection
  get_it: ^8.0.0
  injectable: ^2.4.1

  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # File Picker
  file_picker: ^8.0.3

  # Serialization
  json_annotation: ^4.9.0
  uuid: ^4.4.0

  # Animations
  lottie: ^3.1.2

  # Logger
  logger: ^2.3.0

  # Environment
  flutter_dotenv: ^5.1.0

  # UI utils
  intl: ^0.19.0
  shimmer: ^3.0.0

  sqflite_common: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
